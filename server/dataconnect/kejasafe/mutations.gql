# Auth / profile

mutation UpsertMyUser(
  $email: String!
  $username: String!
  $fullName: String!
  $role: String!
  $googleId: String
  $phone: String
) @auth(level: USER) {
  user_upsert(
    data: {
      id_expr: "auth.uid"
      email: $email
      username: $username
      fullName: $fullName
      role: $role
      googleId: $googleId
      phone: $phone
      kycStatus: "NOT_SUBMITTED"
    }
  )
}

mutation UpdateMyProfile(
  $fullName: String!
  $username: String!
  $major: String
  $yearOfStudy: Int
  $roommatePreferences: String
  $phone: String
  $businessName: String
  $profilePictureUrl: String
) @auth(level: USER) {
  user_update(
    id_expr: "auth.uid"
    data: {
      fullName: $fullName
      username: $username
      major: $major
      yearOfStudy: $yearOfStudy
      roommatePreferences: $roommatePreferences
      phone: $phone
      businessName: $businessName
      profilePictureUrl: $profilePictureUrl
    }
  )
}

mutation SubmitKyc(
  $documentType: String!
  $documentNumber: String!
  $documentFrontImageUrl: String!
  $documentBackImageUrl: String
  $selfieImageUrl: String!
) @auth(level: USER) @transaction {
  kycSubmission_insert(
    data: {
      userId_expr: "auth.uid"
      documentType: $documentType
      documentNumber: $documentNumber
      documentFrontImageUrl: $documentFrontImageUrl
      documentBackImageUrl: $documentBackImageUrl
      selfieImageUrl: $selfieImageUrl
    }
  )
  user_update(
    id_expr: "auth.uid"
    data: { kycStatus: "PENDING" }
  )
}

# Listings

mutation CreateListing(
  $title: String!
  $address: String!
  $pricePerMonth: Float
  $proximity: String
  $university: String
  $propertyType: String!
  $unitsCount: Int!
  $garbageCollection: Float!
  $water: Float!
  $electricityBilling: String!
  $electricityMonthly: Float!
  $extraChargesJson: String!
  $deposit: Float!
) @auth(level: USER) {
  listing_insert(
    data: {
      landlordId_expr: "auth.uid"
      title: $title
      address: $address
      pricePerMonth: $pricePerMonth
      proximity: $proximity
      university: $university
      propertyType: $propertyType
      unitsCount: $unitsCount
      garbageCollection: $garbageCollection
      water: $water
      electricityBilling: $electricityBilling
      electricityMonthly: $electricityMonthly
      extraChargesJson: $extraChargesJson
      deposit: $deposit
      status: "VERIFIED"
      currency: "KES"
    }
  )
}

mutation UpdateListing(
  $id: UUID!
  $title: String
  $address: String
  $pricePerMonth: Float
  $proximity: String
  $university: String
  $propertyType: String
  $unitsCount: Int
  $garbageCollection: Float
  $water: Float
  $electricityBilling: String
  $electricityMonthly: Float
  $extraChargesJson: String
  $deposit: Float
  $status: String
) @auth(
  level: USER
  insecureReason: "Ownership enforced via @check: listing.landlord.id == auth.uid"
) @transaction {
  query
  @check(
    expr: "this.listing != null && this.listing.landlord.id == auth.uid"
    message: "Not your listing"
  )
  @redact {
    listing(id: $id) {
      landlord {
        id
      }
    }
  }
  listing_update(
    id: $id
    data: {
      title: $title
      address: $address
      pricePerMonth: $pricePerMonth
      proximity: $proximity
      university: $university
      propertyType: $propertyType
      unitsCount: $unitsCount
      garbageCollection: $garbageCollection
      water: $water
      electricityBilling: $electricityBilling
      electricityMonthly: $electricityMonthly
      extraChargesJson: $extraChargesJson
      deposit: $deposit
      status: $status
    }
  )
}

