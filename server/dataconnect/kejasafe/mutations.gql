mutation DeleteListingPhoto($id: UUID!) @auth(
  level: USER
  insecureReason: "Ownership enforced via @check: photo.listing.landlord.id == auth.uid"
) @transaction {
  query
  @check(
    expr: "this.listingPhoto != null && this.listingPhoto.listing.landlord.id == auth.uid"
    message: "Not your listing photo"
  )
  @redact {
    listingPhoto(id: $id) {
      listing {
        landlord {
          id
        }
      }
    }
  }
  listingPhoto_delete(id: $id)
}

mutation BookListing(
  $listingId: UUID!
  $landlordId: String!
  $guestName: String!
  $startDate: Timestamp!
  $endDate: Timestamp!
  $notes: String!
  $slotCount: Int!
) @auth(level: USER) {
  listingBooking_insert(
    data: {
      listingId: $listingId
      landlordId: $landlordId
      guestUserId_expr: "auth.uid"
      guestName: $guestName
      startDate: $startDate
      endDate: $endDate
      status: "PENDING"
      notes: $notes
      slotCount: $slotCount
    }
  )
}

mutation ApproveBooking($id: UUID!) @auth(
  level: USER
  insecureReason: "Ownership enforced via @check: listingBooking.landlord.id == auth.uid"
) @transaction {
  query
  @check(
    expr: "this.listingBooking != null && this.listingBooking.landlord.id == auth.uid"
    message: "Not your booking"
  )
