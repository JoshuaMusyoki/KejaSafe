mutation RecordListingView($listingId: UUID!) @auth(level: USER) @transaction {
  listingEvent_insert(
    data: {
      listingId: $listingId
      eventType: "VIEW"
      userId_expr: "auth.uid"
    }
  )
  listing_update(
    id: $listingId
    data: { totalViews_update: { inc: 1 } }
  )
}

# Rent

mutation CreateBill(
  $userId: String!
  $propertyId: UUID!
  $propertyTitle: String!
  $tenantName: String!
  $bookingId: UUID
  $month: Int!
  $year: Int!
  $totalAmount: Float!
  $dueDate: Timestamp!
  $depositIncluded: Boolean!
  $electricityNote: String
) @auth(
  level: USER
  insecureReason: "Ownership enforced via @check: listing.landlord.id == auth.uid"
) @transaction {
  query
  @check(
    expr: "this.listing != null && this.listing.landlord.id == auth.uid"
    message: "Not your listing"
  )
  @redact {
    listing(id: $propertyId) {
      landlord {
        id
      }
    }
  }
  bill_insert(
    data: {
      userId: $userId
      propertyId: $propertyId
      propertyTitle: $propertyTitle
      tenantName: $tenantName
      bookingId: $bookingId
      month: $month
      year: $year
      totalAmount: $totalAmount
      dueDate: $dueDate
      status: "UNPAID"
      depositIncluded: $depositIncluded
      electricityNote: $electricityNote
      paymentRequested: false
    }
  )
}

mutation AddBillItem(
  $billId: UUID!
  $propertyId: UUID!
  $name: String!
  $amount: Float!
) @auth(
  level: USER
  insecureReason: "Ownership enforced via @check: listing.landlord.id == auth.uid"
) @transaction {
  query
  @check(
    expr: "this.listing != null && this.listing.landlord.id == auth.uid && this.bill != null"
    message: "Not your listing's bill"
  )
  @redact {
    listing(id: $propertyId) {
      landlord {
        id
      }
    }
    bill(id: $billId) {
      propertyId
    }
  }
  billItem_insert(data: { billId: $billId, name: $name, amount: $amount })
}

mutation PayBill($id: UUID!) @auth(
  level: USER
  insecureReason: "Ownership enforced via @check: bill.user.id == auth.uid"
) @transaction {
  query
  @check(
    expr: "this.bill != null && this.bill.user.id == auth.uid"
    message: "Not your bill"
  )
  @redact {
    bill(id: $id) {
      user {
        id
      }
    }
  }
  bill_update(id: $id, data: { status: "PAID" })
}

mutation RequestBillPayment($id: UUID!) @auth(
  level: USER
  insecureReason: "Ownership enforced via @check: bill.user.id == auth.uid"
) @transaction {
  query
  @check(
    expr: "this.bill != null && this.bill.user.id == auth.uid"
    message: "Not your bill"
  )
  @redact {
    bill(id: $id) {
      user {
        id
      }
    }
  }
  bill_update(id: $id, data: { paymentRequested: true })
}

mutation UpdateBill(
  $id: UUID!
  $propertyId: UUID!
  $totalAmount: Float
  $depositIncluded: Boolean
  $electricityNote: String
) @auth(
  level: USER
  insecureReason: "Ownership enforced via @check: listing.landlord.id == auth.uid"
) @transaction {
  query
  @check(
    expr: "this.listing != null && this.listing.landlord.id == auth.uid && this.bill != null"
    message: "Not your listing's bill"
  )
  @redact {
    listing(id: $propertyId) {
      landlord {
        id
      }
    }
    bill(id: $id) {
      propertyId
    }
  }
  bill_update(
    id: $id
    data: {
      totalAmount: $totalAmount
      depositIncluded: $depositIncluded
      electricityNote: $electricityNote
    }
  )
}

# Chat

mutation CreateConversation($name: String) @auth(
  level: USER
  insecureReason: "Conversation row has no owner field; creator must call JoinConversation with auth.uid"
) {
  conversation_insert(data: { name: $name })
}

mutation JoinConversation($conversationId: UUID!) @auth(level: USER) {
  conversationParticipant_insert(
    data: {
      conversationId: $conversationId
      userId_expr: "auth.uid"
    }
  )
}

mutation SendMessage(
  $conversationId: UUID!
  $content: String!
  $type: String!
) @auth(level: USER) {
  message_insert(
    data: {
      conversationId: $conversationId
      senderId_expr: "auth.uid"
      content: $content
      type: $type
    }
  )
}
