# Automatically builds release bundles and publishes to Firebase App Distribution
# and Google Play Console after tests pass.
name: Deploy Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Run Tests & Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Run module unit tests
        run: >
          ./gradlew
          :core:jvmTest
          :feature:listing:jvmTest
          :feature:chat:jvmTest
          :server:test
          --no-daemon
          --stacktrace

      - name: Build Android Release App Bundle (.aab)
        run: ./gradlew :app:androidApp:bundleRelease --no-daemon --stacktrace

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-bundle-${{ github.sha }}
          path: app/androidApp/build/outputs/bundle/release/*.aab
          retention-days: 14

  publish-firebase:
    name: Publish to Firebase App Distribution
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT_KEJASAFE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEJASAFE }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Release AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-bundle-${{ github.sha }}
          path: app/androidApp/build/outputs/bundle/release/

      - name: Upload to Firebase App Distribution
        if: env.FIREBASE_APP_ID != ''
        uses: wzieba/firebase-distribution-github-action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceAccountJson: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEJASAFE }}
          file: app/androidApp/build/outputs/bundle/release/*.aab
          groups: testers
          releaseNotes: "Automatic CI release build from GitHub Actions (${{ github.sha }})"

  publish-playstore:
    name: Publish to Google Play Store
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Release AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-bundle-${{ github.sha }}
          path: app/androidApp/build/outputs/bundle/release/

      - name: Publish to Google Play (Internal Track)
        if: env.PLAY_STORE_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.rotd.havenpad
          releaseFiles: app/androidApp/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
