# Checks every pull request and every push to a long-lived branch.
#
# Needs no secrets: it only compiles and tests. Deployment lives in deploy-api.yml and
# deploy-web.yml.
name: CI

on:
  push:
    branches: [master_dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Required even for JVM-only tests: :core and :app:shared declare Android targets,
      # so Gradle cannot configure the build without the SDK.
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Run JVM tests
        run: ./gradlew :server:test :core:jvmTest :app:shared:jvmTest --no-daemon --stacktrace

      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # There is no signing config in the repository yet, so this builds the debug
      # variant. It proves the Android target still compiles and produces an APK that
      # can be shared for manual testing.
      - name: Assemble the debug APK
        run: ./gradlew :app:androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug-${{ github.sha }}
          path: app/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  server-image:
    name: Server jar
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # Builds the artifact the Cloud Run image is made from, so a release never fails
      # for a reason a pull request could have caught.
      - name: Build the fat jar
        run: ./gradlew :server:buildFatJar --no-daemon --stacktrace

      - name: Check the image builds
        run: docker build --file server/Dockerfile --tag kejasafe/server:ci .
