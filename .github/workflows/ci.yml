# Checks every pull request and every push to a long-lived branch.
# Automatically builds release bundles and publishes to Firebase App Distribution
# and Google Play Console after tests pass.
name: CI

on:
  push:
    branches: [master_dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Required even for JVM-only tests: :core and :app:shared declare Android targets,
      # so Gradle cannot configure the build without the SDK.
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # One Gradle invocation, one task per module. commonTest runs on the JVM
      # target, so a pull request does not need a Mac or a browser to fail a bad rule.
      - name: Run module tests
        run: >
          ./gradlew
          :core:jvmTest
          :feature:listing:jvmTest
          :feature:chat:jvmTest
          :feature:rent:jvmTest
          :feature:profile:jvmTest
          :feature:call:jvmTest
          :app:shared:jvmTest
          :server:test
          --no-daemon
          --stacktrace

  android:
    name: Android app & Publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT_KEJASAFE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEJASAFE }}
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Build Android Release App Bundle (.aab)
        run: ./gradlew :app:androidApp:bundleRelease --no-daemon --stacktrace

      - name: Upload to Firebase App Distribution
        if: env.FIREBASE_APP_ID != ''
        uses: wzieba/firebase-distribution-github-action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceAccountJson: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEJASAFE }}
          file: app/androidApp/build/outputs/bundle/release/*.aab
          groups: testers
          releaseNotes: "Automatic CI release build from GitHub Actions (${{ github.sha }})"

      - name: Publish to Google Play (Internal Track)
        if: env.PLAY_STORE_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.rotd.havenpad
          releaseFiles: app/androidApp/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

  server-image:
    name: Server jar
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # Builds the artifact the Cloud Run image is made from, so a release never fails
      # for a reason a pull request could have caught.
      - name: Build the fat jar
        run: ./gradlew :server:buildFatJar --no-daemon --stacktrace

      - name: Check the image builds
        run: docker build --file server/Dockerfile --tag kejasafe/server:ci .

  web:
    name: Web compile
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # Compiles the Wasm sources. Linking the browser binary is a separate,
      # much slower step and stays off the pull-request path.
      - name: Compile the Wasm app
        run: ./gradlew :app:webApp:compileKotlinWasmJs --no-daemon --stacktrace
