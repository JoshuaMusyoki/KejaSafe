# Checks every pull request and every push to a long-lived branch.
#
# Needs no secrets: it only compiles and tests. Deployment lives in deploy-api.yml and
# deploy-web.yml.
name: CI

on:
  push:
    branches: [master_dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Required even for JVM-only tests: :core and :app:shared declare Android targets,
      # so Gradle cannot configure the build without the SDK.
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # One Gradle invocation, one task per module. commonTest runs on the JVM
      # target, so a pull request does not need a Mac or a browser to fail a bad rule.
      - name: Run module tests
        run: >
          ./gradlew
          :core:jvmTest
          :feature:listing:jvmTest
          :feature:chat:jvmTest
          :feature:rent:jvmTest
          :feature:profile:jvmTest
          :feature:call:jvmTest
          :app:shared:jvmTest
          :server:test
          --no-daemon
          --stacktrace

  android:
    name: Android app
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # There is no signing config in the repository yet, so this builds the debug
      # variant. It proves the Android target still compiles and produces an APK that
      # can be shared for manual testing.
      - name: Assemble the debug APK
        run: ./gradlew :app:androidApp:assembleDebug --no-daemon --stacktrace

  server-image:
    name: Server jar
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # Builds the artifact the Cloud Run image is made from, so a release never fails
      # for a reason a pull request could have caught.
      - name: Build the fat jar
        run: ./gradlew :server:buildFatJar --no-daemon --stacktrace

      - name: Check the image builds
        run: docker build --file server/Dockerfile --tag kejasafe/server:ci .

  web:
    name: Web compile
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # Compiles the Wasm sources. Linking the browser binary is a separate,
      # much slower step and stays off the pull-request path.
      - name: Compile the Wasm app
        run: ./gradlew :app:webApp:compileKotlinWasmJs --no-daemon --stacktrace
