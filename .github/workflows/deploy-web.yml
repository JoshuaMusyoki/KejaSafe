# Releases the Compose web app to Firebase Hosting (kejasafe.web.app).
#
# Pushes to the default branch go live; pull requests get a temporary preview URL that
# expires on its own. Requires two repository settings:
#
#   secret FIREBASE_SERVICE_ACCOUNT  - JSON key for a service account that may deploy
#                                      Hosting; see docs/DEPLOYMENT.md for the roles
#   variable KEJASAFE_API_BASE_URL   - https URL of the deployed Cloud Run API
#
# `firebase init hosting:github` writes the key straight into GitHub under the name
# FIREBASE_SERVICE_ACCOUNT_KEJASAFE, and the value cannot be read back out to copy it
# under another name, so either spelling is accepted below.
#
# GCP_PROJECT_ID is optional here and falls back to "kejasafe".
name: Deploy web app

on:
  push:
    branches: [master_dev, main]
    paths:
      - app/**
      - core/**
      - build-logic/**
      - gradle/**
      - gradle.properties
      - settings.gradle.kts
      - firebase.json
      - .github/workflows/deploy-web.yml
  pull_request:
    paths:
      - app/**
      - core/**
      - build-logic/**
      - gradle/**
      - gradle.properties
      - settings.gradle.kts
      - firebase.json
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

# One release at a time per branch; a newer commit cancels an in-flight build.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

env:
  DIST_DIR: app/webApp/build/dist/wasmJs/productionExecutable

jobs:
  release:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Lets the deploy action post the preview URL on the pull request.
      pull-requests: write
      # The action opens a "Deploy Preview" check run to report the URL and its expiry.
      # Without this it fails with "Resource not accessible by integration".
      checks: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # :app:webApp depends on :app:shared and :core, which declare Android targets, so
      # the Android SDK has to be present even though nothing Android is built here.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper is committed without the executable bit from Windows.
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build the web bundle
        run: ./gradlew :app:webApp:wasmJsBrowserDistribution --no-daemon --stacktrace

      # Hosting and Cloud Run are different domains, so the bundle cannot infer the API
      # address from the page it is served on.
      - name: Point the bundle at the API
        env:
          API_BASE_URL: ${{ vars.KEJASAFE_API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::KEJASAFE_API_BASE_URL is not set. The site will deploy, but API calls will fail until you set this repository variable to the Cloud Run URL."
            printf '// No API base URL configured for this build.\n' > "$DIST_DIR/config.js"
          else
            echo "API base URL: $API_BASE_URL"
            printf '// Generated by .github/workflows/deploy-web.yml\nwindow.KEJASAFE_API_BASE_URL = "%s";\n' "$API_BASE_URL" > "$DIST_DIR/config.js"
          fi

      - name: Upload the bundle for inspection
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle-${{ github.sha }}
          path: ${{ env.DIST_DIR }}
          retention-days: 7

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_KEJASAFE }}
          projectId: ${{ vars.GCP_PROJECT_ID || 'kejasafe' }}
          expires: 7d

      - name: Deploy to kejasafe.web.app
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_KEJASAFE }}
          projectId: ${{ vars.GCP_PROJECT_ID || 'kejasafe' }}
          channelId: live
