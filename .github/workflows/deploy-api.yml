# Rolls a new API image out to Cloud Run.
#
# This only replaces the image. The service's environment variables, secrets, Cloud SQL
# connection and bucket mount are set once by deploy/deploy-api.ps1, so the first deploy
# has to happen from a workstation before this workflow can do anything.
#
# Authentication uses Workload Identity Federation, which means no Google Cloud key is
# stored in GitHub. See docs/DEPLOYMENT.md for the one-time setup and the four repository
# variables it needs.
name: Deploy API

on:
  push:
    branches: [master_dev, main]
    paths:
      - server/**
      - core/**
      - build-logic/**
      - gradle/**
      - deploy/cloudbuild.yaml
      - .github/workflows/deploy-api.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to build and deploy
        default: latest
        required: false

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and roll out
    # Stays out of the way until the federation variables exist, rather than failing every
    # push while the API has not been provisioned yet.
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Lets you require a manual approval before anything bills; configure reviewers under
    # Settings > Environments > production.
    environment: production

    permissions:
      contents: read
      # Required to mint the short-lived token that Workload Identity Federation exchanges.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # :server depends on :core, which is multiplatform and declares an Android target.
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Build the fat jar
        run: ./gradlew :server:buildFatJar --no-daemon --stacktrace

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # An image-only rollout against a service that does not exist would create one
      # without a database, secrets or uploads, so stop with an explanation instead.
      - name: Check the service already exists
        run: |
          if ! gcloud run services describe "$SERVICE" --region "$REGION" --format='value(name)' >/dev/null 2>&1; then
            echo "::error::Cloud Run service '$SERVICE' not found in $REGION. Run ./deploy/deploy-api.ps1 from a workstation first: it creates the service with its database, secrets and uploads volume."
            exit 1
          fi
        env:
          SERVICE: ${{ vars.GCP_SERVICE_NAME }}
          REGION: ${{ vars.GCP_REGION }}

      - name: Build the image and deploy it
        run: |
          gcloud builds submit \
            --config deploy/cloudbuild.yaml \
            --substitutions="_REGION=$REGION,_SERVICE=$SERVICE,_TAG=$TAG" \
            .
        env:
          SERVICE: ${{ vars.GCP_SERVICE_NAME }}
          REGION: ${{ vars.GCP_REGION }}
          TAG: ${{ inputs.tag || github.sha }}

      - name: Report the deployed revision
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "### API deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: $URL/health" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error --max-time 30 "$URL/health"
        env:
          SERVICE: ${{ vars.GCP_SERVICE_NAME }}
          REGION: ${{ vars.GCP_REGION }}
